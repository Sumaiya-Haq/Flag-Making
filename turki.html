<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scotland</title>
    <style>
         *{
            margin: 0;
            padding: 0;
    
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            height: 100vh;
        }
        .Scotland-Flag{
            height: 300px;
            width: 300px;
            background-color: #005BB2;
            position: relative;
            
        }
        .S1{
            height: 40px;
            width: 430px;
            background-color: white;
            top: 130px;
            left: -65px;
            position: absolute;
            transform: rotate(45deg);
        }
        .S2{
            
            height: 40px;
            width: 430px;
            background-color: white;
            top: 130px;
            left: -65px;
            position: absolute;
            transform: rotate(-45deg);
        }
       
    </style>
</head>
<body>
    <div class="Scotland-Flag">
        <div class="S1"></div>
        <div class="S2"></div>


    </div>
</body>
</html>
