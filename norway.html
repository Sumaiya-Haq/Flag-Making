<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norway</title>
    <style>
        *{
            margin: 0;
            padding: 0;
    
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            height: 100vh;
        }
        .Norway-flag{
            height: 300px;
            width: 300px;
            background-color: red;
            position: relative;
            
        }
        .n1{
            height: 100%;
            width: 60px;
            background-color: white;
            position: absolute;
            left: 110px;
            top: 0;
        }
        .n2{
            height: 60px;
            width: 100%;
            background-color: white;
            top: 130px;
            left: 0;
            position: absolute;

        }
        .n3{
            height: 100%;
            width: 30px;
            background-color: #00205B;
            position: absolute;
            top: 0;
            left: 125px;
        }
        .n4{
            
            height: 30px;
            width: 100%;
            background-color: #00205B;
            position: absolute;
            top: 145px;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="Norway-flag">
        <div class="n1"></div>
        <div class="n2"></div>
        <div class="n3"></div>
        <div class="n4"></div>

    </div>
</body>
</html>
