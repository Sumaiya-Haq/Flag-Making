<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filistin</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            
        }
        body{
            display: flex;
            background-color: aquamarine;
            justify-content: center;
            align-items: center;
            height: 100vh;

        }
        .flag{
            height: 200px;
            width: 350px;
            background-color: white;
            position: relative;
        }
        .S1{
            height: 33.33%;
            width: 100%;
            background-color: black;
        }
        .S2{
            height: 33.33%;
            width: 100%;
           background-color: white;
        }
        .S3{
            
            height: 33.33%;
            width: 100%;
           background-color: green;
        }
        .S4{
            height: 0;
            width: 0;
            position: absolute;
            /* background: red; */
            border-top: 100px solid transparent;
            border-bottom: 100px solid transparent;
            border-left: 120px solid red;
            top: 0;
            left: 0;

            

        }
    </style>
</head>
<body>
    <div class="filistion-flag">
        <div class="flag">
            <div class="S1"></div>
            <div class="S2"></div>
            <div class="S3"></div>
            <div class="S4"></div>

        </div>

    </div>
</body>
</html>
